databases:
  - name: seat-reservation-db
    plan: free
    databaseName: seatreservation
    user: seatuser
    ipAllowList: []

services:
  - type: web
    name: seat-reservation
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seat-reservation-db
          property: connectionString
      - key: PORT
        value: "8080"
    healthCheckPath: /health/live
